<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>トレーニング設定</title>
<style>:root{--ink:#17211b;--muted:#66736b;--green:#19764a;--pale:#edf7f1;--line:#dce5df;--danger:#b3261e}*{box-sizing:border-box}body{margin:0;background:#f5f7f5;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:680px;margin:auto;padding:24px 16px 108px}h1{font-size:25px;margin:0 0 6px}.lead,.hint{color:var(--muted)}.lead{margin:0 0 24px}.hint{font-size:14px;margin:4px 0 16px}section{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}h2{font-size:19px;margin:0}.goal{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.goal-head{display:flex;justify-content:space-between;align-items:center}.primary{display:flex;gap:7px;align-items:center;font-weight:650}label.field{display:block;font-size:13px;color:var(--muted);margin-top:12px}input,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid #bac6be;border-radius:10px;padding:11px;margin-top:5px}button{font:inherit;border:0;border-radius:11px;padding:11px 14px;font-weight:650}.add{width:100%;background:var(--pale);color:var(--green)}.remove{background:none;color:var(--danger);padding:5px}.group-title{font-weight:700;margin:18px 0 10px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{position:relative}.tile input{position:absolute;opacity:0}.tile span{display:flex;min-height:48px;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);border-radius:12px;padding:8px;font-size:14px}.tile input:checked+span{color:var(--green);background:var(--pale);border-color:var(--green);font-weight:700}.custom-row{display:flex;gap:8px}.custom-row input{margin:0}.custom-row button{white-space:nowrap;background:var(--pale);color:var(--green)}.custom-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{background:#f0f2f0;border-radius:99px;padding:7px 10px;font-size:14px}.chip button{background:none;color:var(--danger);padding:0 0 0 6px}footer{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}.save{display:block;width:min(648px,100%);margin:auto;background:var(--green);color:#fff}.save:disabled{opacity:.55}.status{text-align:center;font-size:14px;margin-bottom:7px;min-height:18px}.error{color:var(--danger)}.success{color:var(--green)}</style></head>
<body><main><h1>トレーニング設定</h1><p class="lead">目標と、利用できる運動環境をまとめて設定できます。</p><section><h2>目標</h2><p class="hint">目標がある場合は、主目標を1つ選んでください。期限は未入力でも構いません。</p><div id="goals"></div><button class="add" id="add-goal" type="button">＋ 副目標を追加</button></section><section><h2>運動環境</h2><p class="hint">利用できるものを複数選択できます。もう一度押すと解除できます。</p><div class="group-title">場所・種目</div><div class="tiles" id="places"></div><div class="group-title">器具</div><div class="tiles" id="equipment"></div><div class="group-title">その他</div><p class="hint">一覧にないものだけ入力してください。「その他」として保存します。</p><div class="custom-row"><input id="custom" maxlength="100" placeholder="例：階段、ヨガマット"><button id="add-custom" type="button">追加</button></div><div id="custom-list" class="custom-list"></div></section></main><footer><div class="status" id="status"></div><button class="save" id="save" type="button">設定を保存</button></footer>
<script>
const state={goals:[],env:[],options:null},$=id=>document.getElementById(id);function show(t,e=false){$('status').textContent=t;$('status').className='status '+(e?'error':'success')}
function goalCard(g={},i){const b=document.createElement('div');b.className='goal';b.dataset.id=g.id||'';const h=document.createElement('div');h.className='goal-head';const p=document.createElement('label');p.className='primary';const r=document.createElement('input');r.type='radio';r.name='primary';r.checked=g.priority==='primary'||(!state.goals.length&&i===0);p.append(r,document.createTextNode('主目標'));const x=document.createElement('button');x.type='button';x.className='remove';x.textContent='削除';x.onclick=()=>{b.remove();document.querySelector('input[name=primary]')?.click()};h.append(p,x);b.append(h);[['種別','select','goal_type'],['達成したいこと','text','target'],['期限（任意）','date','target_date']].forEach(([label,type,name])=>{const l=document.createElement('label');l.className='field';l.textContent=label;let n;if(type==='select'){n=document.createElement('select');state.options.goal_types.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;n.append(o)})}else{n=document.createElement('input');n.type=type;if(name==='target')n.maxLength=200}n.dataset.name=name;n.value=g[name]||'';l.append(n);b.append(l)});return b}
function renderGoals(){const root=$('goals');root.textContent='';state.goals.forEach((g,i)=>root.append(goalCard(g,i)))}function renderTiles(id,names,category){const root=$(id);root.textContent='';names.forEach(name=>{const l=document.createElement('label');l.className='tile';const n=document.createElement('input');n.type='checkbox';n.dataset.name=name;n.dataset.category=category;const found=state.env.find(x=>x.display_name===name&&x.category===category);n.checked=!!found;n.dataset.id=found?.id||'';const s=document.createElement('span');s.textContent=name;l.append(n,s);root.append(l)})}
function renderCustom(){const root=$('custom-list');root.textContent='';state.env.filter(x=>x.category==='other').forEach(item=>{const c=document.createElement('span');c.className='chip';c.append(document.createTextNode(item.display_name));const b=document.createElement('button');b.type='button';b.textContent='×';b.onclick=()=>{state.env=state.env.filter(x=>x!==item);renderCustom()};c.append(b);root.append(c)})}function addGoal(g={priority:'secondary',goal_type:'大会'}){if(document.querySelectorAll('.goal').length>=20)return show('目標は20件までです。',true);$('goals').append(goalCard(g,document.querySelectorAll('.goal').length))}
async function load(){try{const r=await fetch('/settings/profile/api',{cache:'no-store'});if(!r.ok)throw Error(r.status===401?'LINEから設定ページを開き直してください。':'設定を読み込めませんでした。');const d=await r.json();state.goals=d.goals;state.env=d.training_environments;state.options=d.options;renderGoals();renderTiles('places',d.options.activity_places,'activity_place');renderTiles('equipment',d.options.equipment,'equipment');renderCustom()}catch(e){show(e.message,true);$('save').disabled=true}}
$('add-goal').onclick=()=>addGoal();$('add-custom').onclick=()=>{const name=$('custom').value.trim();if(!name)return;if(state.env.some(x=>x.display_name===name)||[...document.querySelectorAll('.tile input')].some(x=>x.dataset.name===name))return show('同じ運動環境がすでにあります。',true);if(document.querySelectorAll('.tile input:checked').length+state.env.filter(x=>x.category==='other').length>=20)return show('運動環境は20件までです。',true);state.env.push({display_name:name,category:'other'});$('custom').value='';renderCustom()};
$('save').onclick=async()=>{show('');const goals=[...document.querySelectorAll('.goal')].map(c=>({id:c.dataset.id||null,goal_type:c.querySelector('[data-name=goal_type]').value,target:c.querySelector('[data-name=target]').value.trim(),target_date:c.querySelector('[data-name=target_date]').value||null,priority:c.querySelector('input[name=primary]').checked?'primary':'secondary'}));if(goals.some(g=>!g.target))return show('目標の「達成したいこと」を入力してください。',true);const selected=[...document.querySelectorAll('.tile input:checked')].map(x=>({id:x.dataset.id||null,display_name:x.dataset.name,category:x.dataset.category,detail:null}));const custom=state.env.filter(x=>x.category==='other').map(x=>({id:x.id||null,display_name:x.display_name,category:'other',detail:x.detail||null}));$('save').disabled=true;show('保存しています…');try{const r=await fetch('/settings/profile/api',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({goals,training_environments:[...selected,...custom]})});if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(typeof d.detail==='string'?d.detail:'保存できませんでした。')}show('保存しました。LINEに戻ってください。');await load()}catch(e){show(e.message,true)}finally{$('save').disabled=false}};load();
</script></body></html>
