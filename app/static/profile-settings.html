<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>トレーニング設定</title>
<style>:root{--ink:#17211b;--muted:#66736b;--green:#19764a;--pale:#edf7f1;--line:#dce5df;--danger:#b3261e}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;background:#f5f7f5;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:100%;max-width:680px;margin:auto;padding:20px 12px 112px}h1{font-size:24px;margin:0 0 6px}.lead,.hint{color:var(--muted)}.lead{margin:0 0 20px}.hint{font-size:14px;margin:4px 0 16px;line-height:1.55}section{min-width:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}h2{font-size:19px;margin:0}.goal{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.goal-head{display:flex;min-width:0;gap:8px;justify-content:space-between;align-items:center}.priority-control{display:flex;min-width:0;gap:8px;align-items:center;white-space:nowrap;font-size:14px}.priority-control input{width:20px;height:20px;flex:0 0 20px;margin:0;accent-color:var(--green)}.priority-badge{display:inline-flex;align-items:center;border-radius:99px;padding:5px 9px;background:#f0f2f0;color:var(--muted);font-size:12px;font-weight:700}.priority-badge.is-primary{background:var(--pale);color:var(--green)}label.field{display:block;min-width:0;font-size:13px;color:var(--muted);margin-top:12px}input:not([type=radio]):not([type=checkbox]),select{display:block;min-width:0;max-width:100%;width:100%;font-family:inherit;font-size:16px;line-height:1.3;color:var(--ink);background:#fff;border:1px solid #bac6be;border-radius:10px;padding:11px;margin-top:5px}input[type=date]{min-height:46px;-webkit-appearance:none;appearance:none}button{font:inherit;border:0;border-radius:11px;padding:11px 14px;font-weight:650}.add{width:100%;min-height:46px;background:var(--pale);color:var(--green)}.remove{flex:0 0 auto;background:none;color:var(--danger);padding:7px}.group-title{font-weight:700;margin:18px 0 10px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{position:relative;min-width:0}.tile input{position:absolute;opacity:0}.tile span{display:flex;min-height:50px;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);border-radius:12px;padding:8px 5px;font-size:14px;line-height:1.3}.tile input:checked+span{color:var(--green);background:var(--pale);border-color:var(--green);font-weight:700}.custom-row{display:flex;min-width:0;gap:8px}.custom-row input{margin:0!important}.custom-row button{flex:0 0 auto;white-space:nowrap;background:var(--pale);color:var(--green)}.custom-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{background:#f0f2f0;border-radius:99px;padding:7px 10px;font-size:14px}.chip button{background:none;color:var(--danger);padding:0 0 0 6px}footer{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fffffff5;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.save{display:block;width:min(656px,100%);min-height:48px;margin:auto;background:var(--green);color:#fff}.save:disabled{opacity:.55}.status{text-align:center;white-space:pre-line;font-size:14px;margin-bottom:5px;min-height:18px}.error{color:var(--danger)}.success{color:var(--green)}@media(max-width:360px){main{padding-left:8px;padding-right:8px}section{padding:13px}.goal{padding:12px}.priority-control{gap:5px;font-size:13px}.priority-badge{padding:4px 7px}.tiles{gap:7px}.tile span{font-size:13px}}</style></head>
<body><main><h1>トレーニング設定</h1><p class="lead">目標と、利用できる運動環境をまとめて設定できます。</p><section><h2>目標</h2><p class="hint">主目標は1件、副目標は複数登録できます。期限は未入力でも構いません。</p><div id="goals"></div><button class="add" id="add-goal" type="button">＋ 主目標を登録</button></section><section><h2>運動環境</h2><p class="hint">利用できるものを複数選択できます。もう一度押すと解除できます。</p><div class="group-title">場所・種目</div><div class="tiles" id="places"></div><div class="group-title">器具</div><div class="tiles" id="equipment"></div><div class="group-title">その他</div><p class="hint">一覧にないものだけ入力してください。「その他」として保存します。</p><div class="custom-row"><input id="custom" maxlength="100" placeholder="例：階段、ヨガマット"><button id="add-custom" type="button">追加</button></div><div id="custom-list" class="custom-list"></div></section></main><footer><div class="status" id="status"></div><button class="save" id="save" type="button">設定を保存</button></footer>
<script>
const aliases={'ルームバイク':'インドアバイク','エアロバイク':'インドアバイク','フィットネスバイク':'インドアバイク'};function newOperationId(){return globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`}const state={goals:[],env:[],options:null,revision:0,operationId:newOperationId()},$=id=>document.getElementById(id);function show(t,e=false){$('status').textContent=t;$('status').className='status '+(e?'error':'success')}function apiError(d,fallback){if(typeof d.detail==='string')return d.detail;if(Array.isArray(d.detail)){const messages=d.detail.map(x=>typeof x?.msg==='string'?x.msg.replace(/^Value error, /,''):'').filter(Boolean);if(messages.length)return messages.join('\n')}return fallback}
function updateGoalUI(){const cards=[...document.querySelectorAll('.goal')];cards.forEach(c=>{const primary=c.querySelector('input[name=primary]').checked,badge=c.querySelector('.priority-badge');badge.textContent=primary?'主目標':'副目標';badge.classList.toggle('is-primary',primary)});$('add-goal').textContent=cards.length?'＋ 副目標を追加':'＋ 主目標を登録'}
function goalCard(g={},i){const b=document.createElement('div');b.className='goal';b.dataset.id=g.id||'';const h=document.createElement('div');h.className='goal-head';const p=document.createElement('label');p.className='priority-control';const r=document.createElement('input');r.type='radio';r.name='primary';r.checked=g.priority==='primary'||(document.querySelectorAll('.goal').length===0&&i===0);r.onchange=updateGoalUI;const badge=document.createElement('span');badge.className='priority-badge';p.append(r,badge,document.createTextNode('主目標に設定'));const x=document.createElement('button');x.type='button';x.className='remove';x.textContent='削除';x.onclick=()=>{const wasPrimary=r.checked;b.remove();if(wasPrimary)document.querySelector('input[name=primary]')?.click();updateGoalUI()};h.append(p,x);b.append(h);[['種別','select','goal_type'],['達成したいこと','text','target'],['期限（任意）','date','target_date']].forEach(([label,type,name])=>{const l=document.createElement('label');l.className='field';l.textContent=label;let n;if(type==='select'){n=document.createElement('select');state.options.goal_types.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;n.append(o)})}else{n=document.createElement('input');n.type=type;if(name==='target')n.maxLength=200}n.dataset.name=name;n.value=g[name]||'';l.append(n);b.append(l)});return b}
function renderGoals(){const root=$('goals');root.textContent='';state.goals.forEach((g,i)=>root.append(goalCard(g,i)));updateGoalUI()}function renderTiles(id,names,category){const root=$(id);root.textContent='';names.forEach(name=>{const l=document.createElement('label');l.className='tile';const n=document.createElement('input');n.type='checkbox';n.dataset.name=name;n.dataset.category=category;const found=state.env.find(x=>x.display_name===name&&x.category===category);n.checked=!!found;n.dataset.id=found?.id||'';const s=document.createElement('span');s.textContent=name;l.append(n,s);root.append(l)})}
function renderCustom(){const root=$('custom-list');root.textContent='';state.env.filter(x=>x.category==='other').forEach(item=>{const c=document.createElement('span');c.className='chip';c.append(document.createTextNode(item.display_name));const b=document.createElement('button');b.type='button';b.textContent='×';b.onclick=()=>{state.env=state.env.filter(x=>x!==item);renderCustom()};c.append(b);root.append(c)})}function addGoal(){const count=document.querySelectorAll('.goal').length;if(count>=20)return show('目標は20件までです。',true);$('goals').append(goalCard({priority:count?'secondary':'primary',goal_type:'大会'},count));updateGoalUI()}
async function load(){try{const r=await fetch('/settings/profile/api',{cache:'no-store'});if(!r.ok)throw Error(r.status===401?'LINEから設定ページを開き直してください。':'設定を読み込めませんでした。');const d=await r.json();state.goals=d.goals;state.env=d.training_environments;state.options=d.options;state.revision=d.revision;renderGoals();renderTiles('places',d.options.activity_places,'activity_place');renderTiles('equipment',d.options.equipment,'equipment');renderCustom()}catch(e){show(e.message,true);$('save').disabled=true}}
$('add-goal').onclick=()=>addGoal();$('add-custom').onclick=()=>{const entered=$('custom').value.trim();if(!entered)return;const name=aliases[entered]||entered;const preset=[...document.querySelectorAll('.tile input')].find(x=>x.dataset.name===name);if(preset){preset.checked=true;$('custom').value='';return show(entered===name?`${name}を選択しました。`:`${entered}は「${name}」として選択しました。`)}if(state.env.some(x=>x.display_name===name))return show('同じ運動環境がすでにあります。',true);if(document.querySelectorAll('.tile input:checked').length+state.env.filter(x=>x.category==='other').length>=20)return show('運動環境は20件までです。',true);state.env.push({display_name:name,category:'other',detail:entered});$('custom').value='';renderCustom()};
$('save').onclick=async()=>{show('');const goals=[...document.querySelectorAll('.goal')].map(c=>({id:c.dataset.id||null,goal_type:c.querySelector('[data-name=goal_type]').value,target:c.querySelector('[data-name=target]').value.trim(),target_date:c.querySelector('[data-name=target_date]').value||null,priority:c.querySelector('input[name=primary]').checked?'primary':'secondary'}));if(goals.some(g=>!g.target))return show('目標の「達成したいこと」を入力してください。',true);const selected=[...document.querySelectorAll('.tile input:checked')].map(x=>({id:x.dataset.id||null,display_name:x.dataset.name,category:x.dataset.category,detail:null}));const custom=state.env.filter(x=>x.category==='other').map(x=>({id:x.id||null,display_name:x.display_name,category:'other',detail:x.detail||x.display_name}));$('save').disabled=true;show('保存しています…');try{const r=await fetch('/settings/profile/api',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({goals,training_environments:[...selected,...custom],expected_revision:state.revision,operation_id:state.operationId})});if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(apiError(d,'保存できませんでした。'))}state.operationId=newOperationId();show('保存しました。LINEに戻ってください。');await load()}catch(e){show(e.message,true)}finally{$('save').disabled=false}};load();
</script></body></html>
