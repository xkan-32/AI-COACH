<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>練習メニュー</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,sans-serif;background:#f4f7f5;color:#17211b}
    body{margin:0}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #16382012}
    h1{font-size:1.45rem;margin:8px 0}h2{font-size:1.05rem;margin:0 0 8px}.meta,.muted{color:#5c6b61;font-size:.9rem}
    .day{border-left:5px solid #2e7d4f}.workout{border-top:1px solid #e5ece7;padding:13px 0}.workout:first-child{border-top:0}.workout-title{font-size:1.05rem}.facts{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.fact{background:#eef5f0;border-radius:8px;padding:5px 8px;font-size:.9rem}.tag{display:inline-block;background:#e7f3eb;border-radius:99px;padding:3px 9px;margin:2px;font-size:.82rem}
    ul{padding-left:20px}.actions{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:18px}.actions button{min-height:48px;border:0;border-radius:10px;font-size:1rem;font-weight:700}
    #approve{background:#247848;color:#fff}#reject{background:#f0e4e4;color:#7b2727}#repropose{grid-column:1/-1;background:#e7ebee;color:#24313a}
    button:disabled{opacity:.5}.error{color:#a02727}.notice{color:#195d39;font-weight:700}
    label{display:block;margin:10px 0 4px;font-weight:700}select,input,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #b9c5bd;border-radius:8px;background:#fff;font:inherit}
    .workout-edit{margin-top:8px;padding:8px 12px;border:1px solid #247848;border-radius:8px;background:#fff;color:#195d39;font-weight:700}
  </style>
</head>
<body>
<main class="wrap">
  <h1>練習メニュー</h1>
  <section id="today" aria-label="今日のメニュー"></section>
  <div id="summary" class="card">読み込み中です…</div>
  <section aria-labelledby="week-heading"><h2 id="week-heading">今週の予定</h2><div id="days"></div></section>
  <section aria-labelledby="history-heading"><h2 id="history-heading">最近の実績</h2><div id="history"></div></section>
  <div id="approval-card" class="card">
    <h2>計画全体への回答</h2>
    <p class="muted">承認した場合だけ、このversionが実施中の計画になります。</p>
    <div class="actions">
      <button id="approve" type="button">この計画を承認</button>
      <button id="reject" type="button">この計画を却下</button>
      <button id="repropose" type="button">別案を依頼</button>
    </div>
    <p id="result" aria-live="polite"></p>
  </div>
  <div id="revision-card" class="card" hidden>
    <h2>計画の変更案を作る</h2>
    <p class="muted">変更案は承認するまで実施中の計画へ反映されません。</p>
    <label for="scope">変更範囲</label>
    <select id="scope"><option value="next_day">翌日のみ</option><option value="from_date">指定日以降</option><option value="remainder_week">残りの週全体</option></select>
    <label for="effective-date">指定日（指定日以降の場合）</label><input id="effective-date" type="date">
    <label for="reason">変更理由</label>
    <select id="reason"><option value="condition">体調・疲労</option><option value="weather">天候</option><option value="schedule">急な予定</option><option value="sleep">睡眠不足</option><option value="environment">環境・器具</option><option value="too_hard">難しすぎる</option><option value="too_easy">軽すぎる</option><option value="preference">別の運動を希望</option><option value="other">その他</option></select>
    <label for="adjustment">希望する調整</label>
    <select id="adjustment"><option value="reduce_load">負荷を下げる</option><option value="rest">休養へ変更</option><option value="indoor">屋内へ変更</option><option value="different_activity">別の種目へ変更</option></select>
    <label for="revision-note">補足（任意）</label><textarea id="revision-note" maxlength="500" rows="3"></textarea>
    <div class="actions"><button id="create-revision" type="button">変更案を作成</button></div>
    <div id="revision-proposal"></div><p id="revision-result" aria-live="polite"></p>
  </div>
  <div id="daily-edit-card" class="card" hidden>
    <h2>このメニューを変更</h2><p class="muted">直接編集では負荷を上げられません。保存すると新しい計画versionがすぐ有効になります。</p>
    <label for="daily-edit-kind">操作</label><select id="daily-edit-kind"><option value="edit">時間・負荷を下げる</option><option value="move_slot">別の時間枠へ移動</option><option value="rest">休養へ変更</option><option value="cancel">取り消す</option></select>
    <label for="daily-edit-date">日付（移動時）</label><input id="daily-edit-date" type="date">
    <label for="daily-edit-time">開始時刻（移動時・編集時）</label><input id="daily-edit-time" type="time">
    <label for="daily-edit-duration">所要時間（分）</label><input id="daily-edit-duration" type="number" min="0" max="240">
    <label for="daily-edit-distance">距離（m、任意）</label><input id="daily-edit-distance" type="number" min="0" max="100000">
    <label for="daily-edit-intensity">強度</label><select id="daily-edit-intensity"><option value="">変更しない</option><option value="rest">休養</option><option value="easy">軽め</option><option value="moderate">中程度</option></select>
    <label for="daily-edit-note">理由・補足（任意）</label><textarea id="daily-edit-note" maxlength="500" rows="2"></textarea>
    <div class="actions"><button id="daily-edit-save" type="button">変更を保存</button></div><p id="daily-edit-result" aria-live="polite"></p>
  </div>
</main>
<script>
let state=null;
const text=(value,fallback="なし")=>value===null||value===undefined||value===""?fallback:String(value);
const list=value=>(value&&value.length)?value.map(v=>`<span class="tag">${escapeHtml(v)}</span>`).join(""):'<span class="muted">なし</span>';
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const labels={easy_run:"イージーラン",run:"ランニング",ride:"サイクリング",strength:"筋力トレーニング",rest:"休養",easy:"軽め",moderate:"中程度",hard:"高強度"};
const label=value=>labels[value]||text(value,"未設定");
const workoutHtml=workout=>`<div class="workout"><strong class="workout-title">${escapeHtml(label(workout.type))}</strong><div class="facts"><span class="fact">開始 ${escapeHtml(text(workout.start_time,"指定なし"))}</span><span class="fact">${escapeHtml(text(workout.duration_minutes,0))}分</span>${workout.distance_meters!==null&&workout.distance_meters!==undefined?`<span class="fact">${escapeHtml(workout.distance_meters)}m</span>`:""}<span class="fact">強度: ${escapeHtml(label(workout.intensity))}</span></div>${workout.environment_ids?.length?`<div><span class="muted">環境:</span> ${list(workout.environment_ids)}</div>`:""}<p>${escapeHtml(workout.rationale||"この日の目的に合わせたメニューです。")}</p>${workout.safety_constraints?.length?`<div><span class="muted">安全:</span> ${list(workout.safety_constraints)}</div>`:""}${state?.daily_edit?.enabled?`<button class="workout-edit" type="button" data-workout-id="${escapeHtml(workout.id)}">このメニューを変更</button>`:""}</div>`;
const activityHtml=activity=>`<article class="card"><strong>${escapeHtml(activity.type)}</strong><p>${escapeHtml(activity.started_at)} / ${text(activity.duration_minutes,0)}分 / ${text(activity.distance_meters,0)}m</p><p>${escapeHtml(activity.intensity||"強度未記録")} / ${escapeHtml(activity.completion_status||"記録済み")}</p></article>`;
async function load(){
  const response=await fetch("/weekly-plan/api",{headers:{"Accept":"application/json"},cache:"no-store"});
  if(!response.ok)throw new Error((await response.json()).detail||"計画を読み込めませんでした。");
  state=await response.json(); const plan=state.plan; const dashboard=state.dashboard;
  document.querySelector("#today").innerHTML=`<article class="card day"><h2>今日のメニュー</h2><p class="meta">${escapeHtml(dashboard.today.date)}</p>${dashboard.today.workouts.length?dashboard.today.workouts.map(workoutHtml).join(""):'<p>予定されているメニューはありません。</p>'}</article>`;
  const responseRationale=plan.training_response;
  const responseHtml=responseRationale?`<h2>実績による調整</h2><p>${responseRationale.evidence_source==="confirmed_planned_activities"?"前週計画と確定照合された実績を参照しています。":"最近の実績を参考情報として参照しています。"}</p><div>${list([`完了 ${responseRationale.completed_activity_count}件`,`高強度の自己申告 ${responseRationale.hard_rpe_activity_count}件`,responseRationale.recommended_maximum_moderate_days===null?"中強度日の上限は変更なし":`中強度日は週${responseRationale.recommended_maximum_moderate_days}日まで`])}</div><div><span class="muted">根拠:</span> ${list(responseRationale.reason_codes)}</div>`:"";
  const statuses={matched:"実施済み",partial:"一部実施",not_performed:"未実施",ambiguous:"確認待ち",unmatched:"未照合",duplicate_candidate:"重複候補",unplanned:"予定外"};
  const reconciliationHtml=plan.reconciliation_summary.length?`<h2>計画と実績の照合</h2>${plan.reconciliation_summary.map(item=>`<p><strong>${escapeHtml(item.scheduled_date)} ${escapeHtml(item.workout_type)}</strong><br>${escapeHtml(statuses[item.status]||item.status)}${item.confirmed?"":"（確認が必要です）"}${item.match_confidence===null?"":` / 一致度 ${Math.round(item.match_confidence*100)}%`}</p>`).join("")}`:"";
  document.querySelector("#summary").innerHTML=`<div class="meta">version ${plan.version} / ${escapeHtml(plan.status)}</div><h2>週間の理由</h2><p>${escapeHtml(plan.rationale||"理由はありません。")}</p>${responseHtml}${reconciliationHtml}<h2>安全制約</h2><div>${list(plan.safety_constraints)}</div><h2>version差分</h2><div>${list(plan.version_changes)}</div>`;
  document.querySelector("#days").innerHTML=plan.days.map(day=>`<article class="card day"><h2>${escapeHtml(day.date)}</h2>${day.workouts.length?day.workouts.map(workoutHtml).join(""):'<p>休養またはメニューなし</p>'}<div><span class="muted">差分:</span> ${list(day.changes)}</div></article>`).join("");
  document.querySelectorAll(".workout-edit").forEach(button=>button.addEventListener("click",()=>openDailyEdit(button.dataset.workoutId)));
  document.querySelector("#history").innerHTML=dashboard.history.activities.length?dashboard.history.activities.map(activityHtml).join(""):'<p class="card muted">最近の実績はまだありません。</p>';
  document.querySelector("#approval-card").hidden=!state.approval;
  document.querySelector("#revision-card").hidden=!(state.revision&&state.revision.enabled);
}
async function decide(decision){
  if(!state)return;
  document.querySelectorAll("button").forEach(button=>button.disabled=true);
  const response=await fetch("/weekly-plan/api/decision",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({plan_id:state.plan.id,version:state.plan.version,decision,action_token:state.approval.actions[decision]})});
  const body=await response.json();
  if(!response.ok){document.querySelector("#result").className="error";document.querySelector("#result").textContent=body.detail||"操作できませんでした。";return}
  const labels={active:"承認しました。",rejected:"却下しました。",reproposal_requested:"別案の依頼を受け付けました。実生成は今後の対応です。",duplicate:"この回答は処理済みです。"};
  document.querySelector("#result").className="notice";document.querySelector("#result").textContent=labels[body.status]||"処理しました。";
}
function renderProposal(proposal){
  const rows=proposal.diff.map(item=>`<div class="card"><strong>${escapeHtml(item.scheduled_date)}</strong><p>${escapeHtml(item.before.workout_type)} ${text(item.before.duration_minutes,0)}分 → ${escapeHtml(item.after.workout_type)} ${text(item.after.duration_minutes,0)}分</p><p>${escapeHtml(item.before.intensity)} → ${escapeHtml(item.after.intensity)}</p></div>`).join("");
  document.querySelector("#revision-proposal").innerHTML=`<h2>変更案 revision ${proposal.revision}</h2>${rows}<div>${list(proposal.safety_flags)}</div><div class="actions"><button type="button" data-revision-decision="approve">変更案を承認</button><button type="button" data-revision-decision="reject">変更しない</button><button type="button" data-revision-decision="repropose">別案を依頼</button></div>`;
  document.querySelectorAll("[data-revision-decision]").forEach(button=>button.addEventListener("click",()=>decideRevision(proposal,button.dataset.revisionDecision)));
}
async function createRevision(){
  const payload={base_plan_id:state.plan.id,scope:document.querySelector("#scope").value,effective_date:document.querySelector("#effective-date").value||null,reason_code:document.querySelector("#reason").value,requested_adjustment:document.querySelector("#adjustment").value,note:document.querySelector("#revision-note").value,operation_id:crypto.randomUUID()};
  const response=await fetch("/weekly-plan/api/revisions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const body=await response.json();
  if(!response.ok)throw new Error(body.detail||"変更案を作成できませんでした。");renderProposal(body);
}
async function decideRevision(proposal,decision){
  document.querySelectorAll("button").forEach(button=>button.disabled=true);
  const response=await fetch("/weekly-plan/api/revisions/decision",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({proposal_id:proposal.id,decision,action_token:proposal.actions[decision]})});const body=await response.json();
  if(!response.ok){document.querySelector("#revision-result").className="error";document.querySelector("#revision-result").textContent=body.detail||"操作できませんでした。";return}
  if(body.proposal){renderProposal(body.proposal);document.querySelectorAll("button").forEach(button=>button.disabled=false)}
  const labels={active:"変更案を承認し、新しい計画を有効にしました。",rejected:"元の計画を維持します。",reproposal_requested:"別案を作成しました。",duplicate:"この回答は処理済みです。"};document.querySelector("#revision-result").className="notice";document.querySelector("#revision-result").textContent=labels[body.status]||"処理しました。";
}
function findWorkout(id){return state.plan.days.flatMap(day=>day.workouts).find(item=>item.id===id)}
function openDailyEdit(id){
  const workout=findWorkout(id);if(!workout)return;state.daily_edit_workout=workout;
  document.querySelector("#daily-edit-card").hidden=false;
  document.querySelector("#daily-edit-date").value="";document.querySelector("#daily-edit-time").value=workout.start_time||"";
  document.querySelector("#daily-edit-duration").value=workout.duration_minutes??"";document.querySelector("#daily-edit-distance").value=workout.distance_meters??"";
  document.querySelector("#daily-edit-intensity").value="";document.querySelector("#daily-edit-note").value="";
  document.querySelector("#daily-edit-card").scrollIntoView({behavior:"smooth"});
}
async function saveDailyEdit(){
  const workout=state&&state.daily_edit_workout;if(!workout)return;
  const kind=document.querySelector("#daily-edit-kind").value;
  const value=id=>document.querySelector(id).value;
  const payload={base_plan_id:state.plan.id,planned_workout_id:workout.id,kind,operation_id:crypto.randomUUID(),scheduled_date:value("#daily-edit-date")||null,start_time:value("#daily-edit-time")||null,duration_minutes:value("#daily-edit-duration")===""?null:Number(value("#daily-edit-duration")),distance_meters:value("#daily-edit-distance")===""?null:Number(value("#daily-edit-distance")),intensity:value("#daily-edit-intensity")||null,note:value("#daily-edit-note")};
  const response=await fetch("/weekly-plan/api/daily-edits",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const body=await response.json();
  if(!response.ok)throw new Error(body.detail||"メニューを変更できませんでした。");
  document.querySelector("#daily-edit-result").className="notice";document.querySelector("#daily-edit-result").textContent="保存しました。表示を更新しています…";
  await load(); document.querySelector("#daily-edit-card").hidden=true;
}
document.querySelector("#approve").addEventListener("click",()=>decide("approve"));
document.querySelector("#reject").addEventListener("click",()=>decide("reject"));
document.querySelector("#repropose").addEventListener("click",()=>decide("repropose"));
document.querySelector("#create-revision").addEventListener("click",()=>createRevision().catch(error=>{document.querySelector("#revision-result").className="error";document.querySelector("#revision-result").textContent=error.message}));
document.querySelector("#daily-edit-save").addEventListener("click",()=>saveDailyEdit().catch(error=>{document.querySelector("#daily-edit-result").className="error";document.querySelector("#daily-edit-result").textContent=error.message}));
load().catch(error=>{document.querySelector("#summary").className="card error";document.querySelector("#summary").textContent=error.message});
</script>
</body>
</html>
