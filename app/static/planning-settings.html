<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>週間計画の条件</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: #17211b; background: #f3f6f3; }
    * { box-sizing: border-box; } body { margin: 0; min-width: 320px; background: #f3f6f3; } main { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }
    h1 { margin: 0; font-size: 24px; } h2 { margin: 0 0 8px; font-size: 18px; } .lead, .hint { color: #526158; line-height: 1.6; } .lead { margin: 8px 0 20px; }
    .card, .slot { background: #fff; border: 1px solid #d7e3d9; border-radius: 14px; box-shadow: 0 1px 2px #17211b0d; } .card { padding: 16px; margin: 14px 0; } .slot { padding: 14px; margin: 12px 0; }
    .slot-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; } .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
    label { display: block; font-size: 14px; font-weight: 650; } input, select { width: 100%; min-height: 44px; margin-top: 6px; padding: 8px 10px; border: 1px solid #aabbb0; border-radius: 9px; background: #fff; color: inherit; font: inherit; font-size: 16px; }
    .checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; } .checks label { display: flex; align-items: center; gap: 7px; padding: 9px 10px; border: 1px solid #cbd8ce; border-radius: 9px; font-weight: 500; } .checks input { width: 18px; min-height: 18px; margin: 0; accent-color: #19764a; }
    .environment-title { margin: 16px 0 0; font-size: 14px; font-weight: 650; } .empty { margin: 10px 0 0; color: #526158; font-size: 14px; }
    button { min-height: 46px; padding: 10px 14px; border: 0; border-radius: 10px; background: #19764a; color: #fff; font: inherit; font-weight: 700; cursor: pointer; } button:disabled { opacity: .6; cursor: wait; } .secondary { background: #e6f3e9; color: #17633e; } .remove { min-height: 36px; padding: 6px 10px; background: #fff; color: #b3261e; border: 1px solid #e5c4c0; }
    .footer { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; } .footer button { flex: 1 1 180px; } a { color: #17633e; } .status { min-height: 24px; margin: 14px 0 0; color: #17633e; line-height: 1.5; } .status.error { color: #b3261e; }
    @media (max-width: 460px) { main { padding: 16px 12px 32px; } .grid { grid-template-columns: 1fr; gap: 8px; } .card, .slot { border-radius: 12px; padding: 13px; } }
  </style>
</head>
<body>
  <main>
    <h1>週間計画の条件</h1>
    <p class="lead">運動できる曜日・時間帯と、その時間に使える環境を登録します。朝ランニング、夜のインドアバイクなどを別々に設定できます。</p>
    <section class="card" aria-labelledby="slots-heading"><h2 id="slots-heading">運動できる時間</h2><p class="hint">同じ曜日に複数追加できます。屋外が難しい夜の枠は「屋外可」を外してください。</p><div id="slots"></div><button class="secondary" id="add" type="button">＋ 時間枠を追加</button></section>
    <section class="card"><h2>希望</h2><div class="checks"><label><input id="weekend" type="checkbox">土日は強度を少し高めにしたい</label></div></section>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="footer"><button id="save" type="button">計画条件を保存</button><a href="/settings/profile">基本設定へ戻る</a></div>
  </main>
  <script>
    const days = ["月", "火", "水", "木", "金", "土", "日"];
    const slots = document.querySelector("#slots"), status = document.querySelector("#status"), save = document.querySelector("#save");
    let version = null, environments = [];
    const operationId = () => globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    const message = (text, isError = false) => { status.textContent = text; status.className = isError ? "status error" : "status"; };
    const labeledInput = (label, type, value, name) => { const element = document.createElement("label"); element.textContent = label; const input = document.createElement("input"); input.type = type; input.value = value; input.dataset.name = name; element.append(input); return element; };
    const checkbox = (label, checked, name, value = "") => { const element = document.createElement("label"), input = document.createElement("input"); input.type = "checkbox"; input.checked = checked; input.dataset.name = name; input.value = value; element.append(input, document.createTextNode(label)); return element; };
    function addSlot(value = {}) {
      const slot = document.createElement("article"); slot.className = "slot"; const title = document.createElement("div"); title.className = "slot-title"; title.append(document.createTextNode("時間枠"));
      const remove = document.createElement("button"); remove.type = "button"; remove.className = "remove"; remove.textContent = "削除"; remove.onclick = () => slot.remove(); title.append(remove); slot.append(title);
      const grid = document.createElement("div"); grid.className = "grid"; const day = document.createElement("label"); day.textContent = "曜日"; const select = document.createElement("select"); select.dataset.name = "weekday";
      days.forEach((name, index) => { const option = document.createElement("option"); option.value = index; option.textContent = `${name}曜`; option.selected = index === (value.weekday ?? 0); select.append(option); }); day.append(select); grid.append(day, labeledInput("開始", "time", value.start_local_time || "06:00", "start"), labeledInput("終了", "time", value.end_local_time || "07:00", "end"), labeledInput("最大運動時間（分）", "number", value.max_workout_minutes || 60, "minutes")); slot.append(grid);
      const constraints = document.createElement("div"); constraints.className = "checks"; constraints.append(checkbox("屋外可", value.outdoors_allowed !== false, "outdoors"), checkbox("この枠で分割可", value.split_allowed === true, "split")); slot.append(constraints);
      const envTitle = document.createElement("p"); envTitle.className = "environment-title"; envTitle.textContent = "この時間に使える運動環境"; slot.append(envTitle); const envChecks = document.createElement("div"); envChecks.className = "checks";
      if (environments.length) environments.forEach(environment => envChecks.append(checkbox(environment.display_name, (value.environment_ids || []).includes(environment.id), "environment", environment.id))); else { const empty = document.createElement("p"); empty.className = "empty"; empty.textContent = "先に基本設定で運動環境を登録してください。"; envChecks.append(empty); } slot.append(envChecks); slots.append(slot);
    }
    function payload() { return [...slots.children].map(slot => { const get = name => slot.querySelector(`[data-name="${name}"]`), start = get("start").value, end = get("end").value; if (!start || !end || start >= end) throw Error("開始時刻より後の終了時刻を入力してください。"); const minutes = Number(get("minutes").value); if (!Number.isInteger(minutes) || minutes < 1 || minutes > 1440) throw Error("最大運動時間は1〜1440分で入力してください。"); return { weekday: Number(get("weekday").value), start_local_time: start, end_local_time: end, max_workout_minutes: minutes, buffer_before_minutes: 0, buffer_after_minutes: 0, environment_ids: [...slot.querySelectorAll('[data-name="environment"]:checked')].map(input => input.value), outdoors_allowed: get("outdoors").checked, split_allowed: get("split").checked }; }); }
    async function load() { const response = await fetch("/settings/planning/api", { credentials: "same-origin" }); if (!response.ok) throw Error("設定を読み込めませんでした。LINEから設定を開き直してください。"); const data = await response.json(); version = data.availability?.version ?? null; environments = data.training_environments || []; slots.replaceChildren(); (data.availability?.slots || []).forEach(addSlot); document.querySelector("#weekend").checked = data.preferences.some(item => item.preference_type === "weekend_intensity" && item.value?.intensity === "moderate"); }
    document.querySelector("#add").onclick = () => addSlot();
    save.onclick = async () => { try { const selectedSlots = payload(); save.disabled = true; message("保存しています…"); const preferences = document.querySelector("#weekend").checked ? [{ preference_type: "weekend_intensity", value: { intensity: "moderate", weekdays: [5, 6] }, strength: "soft" }] : []; const response = await fetch("/settings/planning/api", { method: "PUT", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ expected_availability_version: version, operation_id: operationId(), slots: selectedSlots, preferences }) }); if (!response.ok) { const data = await response.json().catch(() => ({})); throw Error(data.detail || "保存できませんでした。もう一度お試しください。"); } message("保存しました。次回の計画作成からこの条件を使います。"); await load(); } catch (error) { message(error.message || "保存できませんでした。", true); } finally { save.disabled = false; } };
    load().catch(error => message(error.message || "設定を読み込めませんでした。", true));
  </script>
</body>
</html>
