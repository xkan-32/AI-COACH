<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>計画設定</title>
<style>body{font-family:system-ui,sans-serif;background:#f5f7f5;color:#17211b;margin:0;padding:16px}main{max-width:640px;margin:auto}section,.slot{background:#fff;border:1px solid #dce5df;border-radius:14px;padding:14px;margin:12px 0}label{display:block;margin:9px 0}input,select{width:100%;box-sizing:border-box;padding:9px;font:inherit}.checks{display:flex;gap:8px;flex-wrap:wrap}.checks label{width:auto}.checks input{width:auto}button{padding:10px 14px;border:0;border-radius:9px;background:#19764a;color:#fff;font:inherit;font-weight:700}.secondary{background:#edf7f1;color:#19764a}.remove{background:#fff;color:#b3261e;float:right}.status{min-height:24px;white-space:pre-line}.error{color:#b3261e}</style>
<main><h1>週間計画の条件</h1><p>朝・夜など、同じ曜日に複数の時間枠を設定できます。</p><section><div id="slots"></div><button class="secondary" id="add" type="button">時間枠を追加</button></section><section><label><input id="weekend" type="checkbox"> 土日は強度を高めに希望する</label></section><p class="status" id="status"></p><button id="save" type="button">計画条件を保存</button> <a href="/settings/profile">基本設定へ戻る</a></main>
<script>
const days=['月','火','水','木','金','土','日'],status=document.querySelector('#status'),slots=document.querySelector('#slots');let version=null,env=[];const id=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`;const message=(text,error=false)=>{status.textContent=text;status.className=error?'status error':'status'};const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function row(value={weekday:0,start_local_time:'06:00',end_local_time:'07:00',max_workout_minutes:60,outdoors_allowed:true,split_allowed:false,environment_ids:[]}){const el=document.createElement('div');el.className='slot';const environments=env.map(x=>`<label><input type="checkbox" data-env="${escapeHtml(x.id)}" ${value.environment_ids.includes(x.id)?'checked':''}>${escapeHtml(x.display_name)}</label>`).join('');el.innerHTML=`<button class="remove">削除</button><label>曜日<select data-day>${days.map((x,i)=>`<option value="${i}" ${i===value.weekday?'selected':''}>${x}曜</option>`).join('')}</select></label><label>開始<input data-start type="time" value="${value.start_local_time}"></label><label>終了<input data-end type="time" value="${value.end_local_time}"></label><label>最大運動時間（分）<input data-minutes type="number" min="1" value="${value.max_workout_minutes||''}"></label><div class="checks"><label><input data-outdoors type="checkbox" ${value.outdoors_allowed?'checked':''}>屋外可</label><label><input data-split type="checkbox" ${value.split_allowed?'checked':''}>分割可</label></div><div class="checks">${environments||'先に基本設定で運動環境を登録してください。'}</div>`;el.querySelector('.remove').onclick=()=>el.remove();slots.append(el)}
async function load(){const r=await fetch('/settings/planning/api');if(!r.ok)throw Error('設定を読み込めませんでした。');const data=await r.json();version=data.availability?.version??null;env=data.training_environments||[];slots.textContent='';(data.availability?.slots||[]).forEach(row);document.querySelector('#weekend').checked=data.preferences.some(x=>x.preference_type==='weekend_intensity'&&x.value?.intensity==='moderate')}
document.querySelector('#add').onclick=()=>row();document.querySelector('#save').onclick=async()=>{const value=[...slots.children].map(x=>({weekday:+x.querySelector('[data-day]').value,start_local_time:x.querySelector('[data-start]').value,end_local_time:x.querySelector('[data-end]').value,max_workout_minutes:+x.querySelector('[data-minutes]').value||null,buffer_before_minutes:0,buffer_after_minutes:0,environment_ids:[...x.querySelectorAll('[data-env]:checked')].map(y=>y.dataset.env),outdoors_allowed:x.querySelector('[data-outdoors]').checked,split_allowed:x.querySelector('[data-split]').checked}));if(value.some(x=>!x.start_local_time||!x.end_local_time))return message('開始・終了時刻を入力してください。',true);const preferences=document.querySelector('#weekend').checked?[{preference_type:'weekend_intensity',value:{intensity:'moderate',weekdays:[5,6]},strength:'soft'}]:[];const r=await fetch('/settings/planning/api',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_availability_version:version,operation_id:id(),slots:value,preferences})});if(!r.ok){const d=await r.json().catch(()=>({}));return message(d.detail||'保存できませんでした。',true)}message('保存しました。');await load()};load().catch(e=>message(e.message,true));
</script></html>
