[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-training-coach"
version = "0.1.0"
description = "Strava, LINE, and Vertex AI training coach MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "google-auth>=2.35,<3",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
gcp = [
  "google-cloud-bigquery>=3.27,<4",
  "google-genai>=1.0,<2",
  "google-cloud-tasks>=2.16,<3",
  "google-cloud-firestore>=2.19,<3",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
